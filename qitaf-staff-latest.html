<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الموظف | قطاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #EFE4CC;
    --card: #FBF6E9;
    --ink: #2B2117;
    --ink-soft: #5C4E3D;
    --gold: #D9A441;
    --gold-deep: #B9812A;
    --olive: #6E7B4E;
    --red: #C05A3E;
    --line: rgba(43,33,23,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Tajawal', sans-serif;
    background: var(--kraft);
    color: var(--ink);
    min-height:100vh;
    padding: 18px 14px 40px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:560px;
    margin: 0 auto 18px;
  }
  header h1{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size: 1.25rem;
    color: var(--gold-deep);
  }
  header p{ font-size:0.78rem; color: var(--ink-soft); margin-top:2px; }
  .settings-btn{
    background: var(--card);
    border: 1px solid var(--line);
    width:38px; height:38px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor:pointer;
  }

  .new-order-box{
    max-width: 560px;
    margin: 0 auto 20px;
    background: var(--card);
    border: 1px dashed var(--gold);
    border-radius: 16px;
    padding: 16px;
  }
  .new-order-box h3{
    font-family:'Cairo', sans-serif;
    font-size: 0.92rem;
    margin-bottom: 10px;
  }
  .new-order-box input, .new-order-box textarea{
    width:100%;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    font-family:'Tajawal', sans-serif;
    font-size: 0.86rem;
    margin-bottom: 8px;
  }
  .new-order-box button{
    width:100%;
    background: var(--olive);
    color:#fff;
    border:none;
    padding: 11px;
    border-radius: 10px;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size: 0.9rem;
    cursor:pointer;
  }

  .filters{
    max-width:560px;
    margin: 0 auto 14px;
    display:flex;
    gap:8px;
    overflow-x:auto;
  }
  .filter-btn{
    flex-shrink:0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 16px;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size: 0.8rem;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .filter-btn.active{
    background: var(--ink);
    color: var(--kraft);
    border-color: var(--ink);
  }

  .order-list{
    max-width:560px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .order-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom: 8px;
  }
  .order-id{ font-family:'Cairo', sans-serif; font-weight:800; font-size: 1rem; }
  .stage-tag{
    font-size: 0.72rem;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    padding: 3px 10px;
    border-radius: 12px;
    background: var(--kraft);
    color: var(--ink-soft);
  }
  .stage-tag.late{ background: var(--red); color:#fff; }

  .order-info{ font-size: 0.82rem; color: var(--ink-soft); line-height:1.6; margin-bottom: 12px; }
  .order-info b{ color: var(--ink); }
  .map-link{ color: var(--gold-deep); font-weight:700; text-decoration:none; display:inline-block; margin-top:4px; }

  .timer-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--ink);
    color: var(--kraft);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .timer-box .label{ font-size: 0.78rem; opacity:0.75; }
  .timer-box .value{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size: 1.4rem;
    color: var(--gold);
    direction:ltr;
  }
  .timer-box .value.late{ color: #ff8f75; }

  .finish-btn{
    width:100%;
    background: var(--gold);
    color:#fff;
    border:none;
    padding: 12px;
    border-radius: 10px;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size: 0.92rem;
    cursor:pointer;
  }
  .finish-btn.delivered{ background: var(--olive); }
  .finish-btn:disabled{ background: #B9B29C; cursor:not-allowed; }

  .done-label{
    text-align:center;
    color: var(--olive);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size: 0.85rem;
    padding: 8px 0;
  }

  .empty{ text-align:center; color: var(--ink-soft); font-size:0.85rem; padding: 40px 10px; }

  /* Settings modal */
  .overlay{
    position:fixed; inset:0;
    background: rgba(43,33,23,0.55);
    z-index: 30;
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background: var(--kraft);
    border-radius: 18px;
    padding: 22px;
    max-width: 360px;
    width:100%;
  }
  .modal h2{ font-family:'Cairo', sans-serif; font-size:1.1rem; margin-bottom: 14px; }
  .modal label{
    display:block;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    margin-bottom:4px;
  }
  .modal input{
    width:100%;
    border:1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-family:'Tajawal', sans-serif;
    font-size:0.9rem;
  }
  .modal button{
    width:100%;
    background: var(--gold-deep);
    color:#fff;
    border:none;
    padding: 12px;
    border-radius: 10px;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  .modal .cancel{
    background: transparent;
    color: var(--ink-soft);
    margin-top: 6px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>قطاف · لوحة الموظف</h1>
    <p>العدادات بتشتغل أوتوماتيك بالتتابع</p>
  </div>
  <button class="settings-btn" id="settingsBtn">⚙️</button>
</header>

<div class="new-order-box">
  <h3>➕ إضافة طلب جديد (من واتساب أو الصفحة)</h3>
  <input type="text" id="newOrderName" placeholder="اسم العميل">
  <input type="text" id="newOrderPhone" placeholder="رقم الموبايل">
  <textarea id="newOrderAddress" placeholder="العنوان" rows="2"></textarea>
  <button id="addOrderBtn">إضافة الطلب — يبدأ عداد التحضير تلقائي</button>
</div>

<div class="filters">
  <div class="filter-btn active" data-filter="all">الكل</div>
  <div class="filter-btn" data-filter="preparing">تحضير</div>
  <div class="filter-btn" data-filter="packing">تجهيز وتغليف</div>
  <div class="filter-btn" data-filter="delivering">توصيل</div>
  <div class="filter-btn" data-filter="delivered">تم التسليم</div>
</div>

<div class="order-list" id="orderList">
  <div class="empty">جاري تحميل الطلبات...</div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>⚙️ إعدادات المدة (بالدقايق)</h2>
    <div id="pinGate">
      <label>كلمة سر المدير</label>
      <input type="password" id="pinInput" placeholder="••••">
      <button id="pinConfirm">دخول</button>
      <button class="cancel" id="pinCancel">إلغاء</button>
    </div>
    <div id="settingsForm" style="display:none;">
      <label>مدة التحضير</label>
      <input type="number" id="durPreparing" min="1">
      <label>مدة التجهيز والتغليف</label>
      <input type="number" id="durPacking" min="1">
      <label>مدة التوصيل</label>
      <input type="number" id="durDelivering" min="1">
      <button id="saveSettings">حفظ</button>
      <button class="cancel" id="settingsCancel">إغلاق</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ====== بيانات Firebase بتاعة قطاف ======
  const firebaseConfig = {
    apiKey: "AIzaSyBT2PiOR05uJkiNB2GgNiy7X8hfOjHaoUA",
    authDomain: "qitaf-orders.firebaseapp.com",
    databaseURL: "https://qitaf-orders-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "qitaf-orders",
    storageBucket: "qitaf-orders.firebasestorage.app",
    messagingSenderId: "705411886211",
    appId: "1:705411886211:web:37cacf678fa03ceb867fb6",
  };
  // ==========================================

  const MANAGER_PIN = "1234"; // غيّرها لرقم سري بسيط تختاره

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ordersRef = ref(db, 'orders');
  const settingsRef = ref(db, 'settings');

  const STAGE_LABELS = {
    preparing: 'تحضير',
    packing: 'تجهيز وتغليف',
    delivering: 'توصيل',
    delivered: 'تم التسليم'
  };
  const STAGE_ORDER = ['preparing', 'packing', 'delivering', 'delivered'];
  const NEXT_STAGE = { preparing: 'packing', packing: 'delivering', delivering: 'delivered' };

  let durations = { preparing: 6, packing: 4, delivering: 20 }; // قيم افتراضية بالدقايق
  let allOrders = {};
  let activeFilter = 'all';
  let tickInterval = null;

  onValue(settingsRef, (snap) => {
    const d = snap.val();
    if(d){
      durations = { preparing: d.preparing || 6, packing: d.packing || 4, delivering: d.delivering || 20 };
    }
  });

  onValue(ordersRef, (snapshot) => {
    allOrders = snapshot.val() || {};
    renderList();
  });

  if(!tickInterval){
    tickInterval = setInterval(renderTimers, 1000);
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderList();
    });
  });

  function stageStartTime(order, stage){
    return order.stageStarts ? order.stageStarts[stage] : null;
  }

  function renderList(){
    const list = document.getElementById('orderList');
    let entries = Object.entries(allOrders);
    if(activeFilter !== 'all'){
      entries = entries.filter(([id, o]) => o.stage === activeFilter);
    }
    entries.sort((a,b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

    if(entries.length === 0){
      list.innerHTML = '<div class="empty">مفيش طلبات هنا دلوقتي</div>';
      return;
    }

    list.innerHTML = entries.map(([id, o]) => {
      const isDelivered = o.stage === 'delivered';
      return `
        <div class="order-card" data-id="${id}" data-stage="${o.stage}">
          <div class="order-top">
            <div class="order-id">${id}</div>
            <div class="stage-tag" data-tag="${id}">${STAGE_LABELS[o.stage]}</div>
          </div>
          <div class="order-info">
            <b>${o.customerName || '—'}</b> · ${o.customerPhone || '—'}<br>
            ${o.address || ''}
            ${o.location ? `<br><a href="https://maps.google.com/?q=${o.location.lat},${o.location.lng}" target="_blank" class="map-link">📍 افتح الموقع على الخريطة</a>` : ''}
          </div>
          ${isDelivered ? `
            <div class="done-label">✓ اتسلم للعميل</div>
          ` : `
            <div class="timer-box">
              <span class="label">الوقت المتبقي لمرحلة ${STAGE_LABELS[o.stage]}</span>
              <span class="value" data-timer="${id}">--:--</span>
            </div>
            <button class="finish-btn" data-finish="${id}" data-stage="${o.stage}">
              إنهاء ${STAGE_LABELS[o.stage]}
            </button>
          `}
        </div>
      `;
    }).join('');

    list.querySelectorAll('[data-finish]').forEach(btn => {
      btn.addEventListener('click', () => finishStage(btn.dataset.finish, btn.dataset.stage));
    });

    renderTimers();
  }

  function renderTimers(){
    Object.entries(allOrders).forEach(([id, o]) => {
      if(o.stage === 'delivered') return;
      const el = document.querySelector(`[data-timer="${id}"]`);
      if(!el) return;
      const start = stageStartTime(o, o.stage);
      if(!start) { el.textContent = '--:--'; return; }

      const durationMs = (durations[o.stage] || 5) * 60 * 1000;
      const elapsed = Date.now() - start;
      const remaining = durationMs - elapsed;
      const tag = document.querySelector(`[data-tag="${id}"]`);

      if(remaining <= 0){
        const over = Math.abs(remaining);
        const m = Math.floor(over / 60000);
        const s = Math.floor((over % 60000) / 1000);
        el.textContent = `+${m}:${s.toString().padStart(2,'0')}`;
        el.classList.add('late');
        if(tag) tag.classList.add('late');
      } else {
        const m = Math.floor(remaining / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        el.classList.remove('late');
        if(tag) tag.classList.remove('late');
      }
    });
  }

  function finishStage(id, currentStage){
    const next = NEXT_STAGE[currentStage];
    const now = Date.now();
    const updates = {
      stage: next,
      [`stageStarts/${next}`]: now,
      [`stageEnds/${currentStage}`]: now
    };
    update(ref(db, 'orders/' + id), updates);
  }

  function generateOrderId(){
    const now = new Date();
    const stamp = now.getFullYear().toString().slice(2) + (now.getMonth()+1).toString().padStart(2,'0') + now.getDate().toString().padStart(2,'0');
    return `Q${stamp}${Math.floor(Math.random()*900+100)}`;
  }

  document.getElementById('addOrderBtn').addEventListener('click', () => {
    const name = document.getElementById('newOrderName').value.trim();
    const phone = document.getElementById('newOrderPhone').value.trim();
    const address = document.getElementById('newOrderAddress').value.trim();

    if(!name){
      alert('محتاج على الأقل اسم العميل');
      return;
    }

    let id = generateOrderId();
    // احتياطًا: لو نفس الرقم موجود بالصدفة، ولّد رقم تاني
    while(allOrders[id]){ id = generateOrderId(); }

    const now = Date.now();
    set(ref(db, 'orders/' + id), {
      customerName: name,
      customerPhone: phone,
      address: address,
      stage: 'preparing',
      createdAt: now,
      stageStarts: { preparing: now }
    }).then(() => {
      document.getElementById('newOrderName').value = '';
      document.getElementById('newOrderPhone').value = '';
      document.getElementById('newOrderAddress').value = '';
      alert('تم إضافة الطلب برقم: ' + id);
    });
  });

  // Settings modal
  const settingsOverlay = document.getElementById('settingsOverlay');
  document.getElementById('settingsBtn').addEventListener('click', () => {
    settingsOverlay.classList.add('show');
    document.getElementById('pinGate').style.display = 'block';
    document.getElementById('settingsForm').style.display = 'none';
    document.getElementById('pinInput').value = '';
  });
  document.getElementById('pinCancel').addEventListener('click', () => settingsOverlay.classList.remove('show'));
  document.getElementById('settingsCancel').addEventListener('click', () => settingsOverlay.classList.remove('show'));

  document.getElementById('pinConfirm').addEventListener('click', () => {
    if(document.getElementById('pinInput').value === MANAGER_PIN){
      document.getElementById('pinGate').style.display = 'none';
      document.getElementById('settingsForm').style.display = 'block';
      document.getElementById('durPreparing').value = durations.preparing;
      document.getElementById('durPacking').value = durations.packing;
      document.getElementById('durDelivering').value = durations.delivering;
    } else {
      alert('كلمة السر غلط');
    }
  });

  document.getElementById('saveSettings').addEventListener('click', () => {
    const newDurations = {
      preparing: parseInt(document.getElementById('durPreparing').value) || 6,
      packing: parseInt(document.getElementById('durPacking').value) || 4,
      delivering: parseInt(document.getElementById('durDelivering').value) || 20,
    };
    set(settingsRef, newDurations).then(() => {
      settingsOverlay.classList.remove('show');
    });
  });
</script>
</body>
</html>
