<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قطاف | القطفة الأولى لك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #EFE4CC; --kraft-dark: #E2D3B0; --card: #FBF6E9;
    --ink: #2B2117; --ink-soft: #5C4E3D;
    --gold: #D9A441; --gold-deep: #B9812A;
    --olive: #6E7B4E; --olive-dark: #545F3B;
    --whatsapp: #25D366; --whatsapp-deep: #1DA851;
    --red: #C05A3E;
    --line: rgba(43,33,23,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Tajawal', sans-serif;
    background: radial-gradient(ellipse at top left, rgba(217,164,65,0.08), transparent 55%), var(--kraft);
    color: var(--ink); min-height:100vh; padding-bottom: 110px;
  }
  header{ padding: 26px 20px 18px; text-align:center; border-bottom: 1px solid var(--line); }
  .banner-image{ display:none; max-width: 620px; margin: 0 auto 16px; border-radius: 18px; overflow:hidden; }
  .banner-image.show{ display:block; }
  .banner-image img{ width:100%; display:block; object-fit: cover; max-height: 260px; }
  .logo-word{ font-family:'Cairo', sans-serif; font-weight:900; font-size: clamp(2.4rem, 8vw, 3.2rem); color: var(--gold-deep); }
  .logo-tagline{ font-family:'Cairo', sans-serif; font-weight:700; font-size: 0.9rem; color: var(--ink); margin-top: 4px; }
  .hero-line{ max-width: 480px; margin: 14px auto 0; font-size: 0.95rem; color: var(--ink-soft); line-height:1.7; }
  .date-row{ margin-top: 10px; font-size: 0.82rem; color: var(--ink-soft); }
  .date-row b{ color: var(--gold-deep); }

  .discount-banner{
    display:none; max-width: 620px; margin: 16px auto 0; padding: 12px 18px;
    background: linear-gradient(90deg, var(--red), #d97a5c); color:#fff;
    border-radius: 14px; text-align:center; font-family:'Cairo',sans-serif; font-weight:800;
    font-size: 0.95rem;
  }
  .discount-banner.show{ display:block; }

  main{ max-width: 640px; margin: 0 auto; padding: 18px 16px 0; }

  .tabs{ display:flex; gap:8px; margin-bottom: 16px; }
  .tab-btn{
    flex:1; background: var(--card); border:1px solid var(--line); border-radius: 12px;
    padding: 11px; font-family:'Cairo', sans-serif; font-weight:800; font-size: 0.92rem;
    color: var(--ink-soft); cursor:pointer;
  }
  .tab-btn.active{ background: var(--ink); color: var(--kraft); border-color: var(--ink); }

  .grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width:520px){ .grid{ grid-template-columns: repeat(3, 1fr); } }

  .card{
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
    display:flex; flex-direction:column; gap:6px; position:relative;
  }
  .card.in-cart{ border-color: var(--gold); box-shadow: 0 4px 16px rgba(217,164,65,0.16); }
  .card-emoji{ font-size: 2.1rem; text-align:center; background: var(--kraft-dark); border-radius: 12px; padding: 10px 0; }
  .card-name{ font-family:'Cairo', sans-serif; font-weight:700; font-size: 0.96rem; }

  .variant-select{
    width:100%; border:1px solid var(--line); background:#fff; border-radius: 8px;
    padding: 5px 6px; font-family:'Tajawal',sans-serif; font-size: 0.78rem;
  }
  .card-price{ font-family:'Cairo', sans-serif; font-weight:800; font-size: 0.98rem; color: var(--gold-deep); }
  .card-price .old-price{ text-decoration: line-through; color: var(--ink-soft); font-size:0.78rem; font-weight:500; margin-inline-start:4px; }

  .qty-row{ display:flex; align-items:center; justify-content:space-between; background: var(--kraft); border-radius: 10px; padding: 3px; }
  .qty-btn{ width: 30px; height: 30px; border-radius: 8px; border:none; background: var(--card); font-size: 1.05rem; font-weight:700; cursor:pointer; }
  .qty-val{ font-family:'Cairo', sans-serif; font-weight:800; font-size: 0.98rem; min-width: 24px; text-align:center; }
  .out-badge{ position:absolute; top:8px; right:8px; background: var(--ink); color: var(--kraft); font-size:0.62rem; padding: 2px 7px; border-radius: 20px; font-weight:700; }

  .empty-hint{ text-align:center; color: var(--ink-soft); font-size:0.85rem; padding: 30px 10px; }

  .cart-bar{
    position: fixed; bottom: 0; left:0; right:0; z-index: 10; background: var(--ink); color: var(--kraft);
    padding: 14px 18px; display:flex; align-items:center; justify-content:space-between; gap: 12px;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.18); transform: translateY(110%); transition: transform 0.3s ease;
  }
  .cart-bar.show{ transform: translateY(0); }
  .cart-bar .info{ font-family:'Cairo', sans-serif; }
  .cart-bar .count{ font-size:0.78rem; opacity:0.75; }
  .cart-bar .total{ font-size:1.15rem; font-weight:800; color: var(--gold); }
  .cart-bar .total .old{ text-decoration: line-through; opacity:0.6; font-size:0.85rem; margin-inline-end:6px; }
  .cart-bar button{ font-family:'Cairo', sans-serif; font-weight:800; background: var(--gold); color: var(--ink); border:none; padding: 12px 22px; border-radius: 12px; font-size: 0.95rem; cursor:pointer; }

  .overlay{ position:fixed; inset:0; background: rgba(43,33,23,0.55); z-index: 20; display:none; align-items:flex-end; justify-content:center; }
  .overlay.show{ display:flex; }
  .sheet{ background: var(--kraft); width:100%; max-width: 640px; border-radius: 24px 24px 0 0; padding: 22px 20px 26px; max-height: 88vh; overflow-y:auto; }
  .sheet h2{ font-family:'Cairo', sans-serif; font-weight:800; font-size: 1.3rem; margin-bottom: 4px; }
  .sheet .sub{ color: var(--ink-soft); font-size:0.85rem; margin-bottom:16px; }
  .order-list{ background: var(--card); border-radius: 14px; padding: 6px 14px; margin-bottom: 18px; }
  .order-row{ display:flex; justify-content:space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size:0.9rem; }
  .order-row:last-child{ border-bottom:none; }
  .order-row .sub-total{ font-family:'Cairo', sans-serif; font-weight:700; color: var(--gold-deep); }
  .order-total-row{ display:flex; justify-content:space-between; padding-top: 10px; font-family:'Cairo', sans-serif; font-weight:800; font-size: 1.05rem; }
  .discount-row{ display:flex; justify-content:space-between; padding-top:6px; color: var(--red); font-size:0.88rem; font-weight:700; }

  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-family:'Cairo', sans-serif; font-weight:700; font-size: 0.88rem; margin-bottom: 6px; }
  .field input, .field textarea{ width:100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-family:'Tajawal', sans-serif; font-size: 0.95rem; }
  .field textarea{ resize: vertical; min-height: 64px; }
  .location-btn{
    width:100%; margin-top:8px; background: var(--card); border:1px solid var(--gold);
    color: var(--gold-deep); border-radius: 10px; padding: 10px; font-family:'Cairo',sans-serif;
    font-weight:700; font-size: 0.85rem; cursor:pointer;
  }
  .location-btn.done{ background: rgba(110,123,78,0.12); border-color: var(--olive); color: var(--olive-dark); }
  .location-status{ font-size: 0.78rem; color: var(--ink-soft); margin-top: 6px; text-align:center; }

  .pay-options{ display:flex; gap: 10px; }
  .pay-option{ flex:1; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 10px; text-align:center; cursor:pointer; font-family:'Cairo', sans-serif; font-weight:700; font-size: 0.88rem; }
  .pay-option.active{ border-color: var(--gold); background: rgba(217,164,65,0.14); color: var(--gold-deep); }

  .send-btn{ width:100%; margin-top: 8px; background: var(--whatsapp); color:#fff; border:none; padding: 15px; border-radius: 14px; font-family:'Cairo', sans-serif; font-weight:800; font-size: 1rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
  .send-btn:disabled{ background: #B9B29C; cursor:not-allowed; }
  .form-error{
    background: rgba(192,90,62,0.12); border: 1px solid var(--red); color: var(--red);
    border-radius: 12px; padding: 12px 14px; font-size: 0.86rem; font-weight:600;
    text-align:center; margin-top: 10px; line-height:1.6;
  }
  .min-order-warning{
    background: rgba(217,164,65,0.15); border: 1px solid var(--gold); color: var(--gold-deep);
    border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; font-weight:700; text-align:center;
  }
  .close-sheet{ position:absolute; top:16px; left:16px; background: var(--card); border:none; width:34px; height:34px; border-radius: 50%; font-size: 1.1rem; cursor:pointer; }
  .sheet-wrap{ position:relative; }
  footer{ text-align:center; padding: 30px 20px 20px; color: var(--ink-soft); font-size: 0.8rem; }
</style>
</head>
<body>

<header>
  <div class="logo-word">قطاف</div>
  <div class="logo-tagline">القطفة الأولى لك</div>
  <p class="hero-line">قطاف هو اختياراتنا لك.</p>
  <div class="date-row">طلبات <b id="today-date"></b></div>
</header>

<div class="banner-image" id="bannerImageBox"><img id="bannerImageEl" src="" alt="قطاف"></div>

<div class="discount-banner" id="discountBanner"></div>
<div class="discount-banner" id="deliveryBanner" style="background: linear-gradient(90deg, var(--olive), var(--olive-dark));"></div>

<main>
  <div class="tabs">
    <div class="tab-btn active" data-cat="all">الكل</div>
    <div class="tab-btn" data-cat="vegetable">خضار</div>
    <div class="tab-btn" data-cat="fruit">فاكهة</div>
  </div>
  <div class="grid" id="product-grid"><p class="empty-hint">جاري تحميل الأصناف...</p></div>
</main>

<div class="cart-bar" id="cartBar">
  <div class="info">
    <div class="count" id="cartCount">0 صنف</div>
    <div class="total" id="cartTotal">0 جنيه</div>
  </div>
  <button id="openCheckout">أكمل الطلب</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-wrap">
      <button class="close-sheet" id="closeSheet">✕</button>
      <h2>طلبك جاهز؟</h2>
      <p class="sub">راجع الطلب واملأ بياناتك، وهيتفتحلك واتساب برسالة جاهزة تبعتهالنا.</p>
      <div class="order-list" id="orderList"></div>
      <div class="field"><label for="custName">الاسم</label><input type="text" id="custName" placeholder="اسمك بالكامل"></div>
      <div class="field"><label for="custPhone">رقم الموبايل</label><input type="tel" id="custPhone" placeholder="01xxxxxxxxx"></div>
      <div class="field">
        <label for="custAddress">العنوان بالتفصيل</label>
        <textarea id="custAddress" placeholder="الحي، الشارع، رقم العمارة والدور..."></textarea>
        <button type="button" id="shareLocationBtn" class="location-btn">📍 شارك موقعك الحالي (يساعدنا نوصلك بدقة)</button>
        <div id="locationStatus" class="location-status"></div>
      </div>
      <div class="field">
        <label>طريقة الدفع</label>
        <div class="pay-options">
          <div class="pay-option active" data-pay="كاش عند الاستلام">كاش عند الاستلام</div>
          <div class="pay-option" data-pay="تحويل / فودافون كاش">تحويل / فودافون كاش</div>
        </div>
      </div>
      <div id="formError" class="form-error" style="display:none;"></div>
      <button class="send-btn" id="sendOrder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.82L2 22l5.4-1.36c1.37.72 2.94 1.13 4.6 1.13h.02c5.46 0 9.9-4.45 9.9-9.91C21.93 6.45 17.5 2 12.04 2zm5.6 14.14c-.24.66-1.38 1.29-1.9 1.36-.49.07-1.05.1-1.7-.1-.39-.12-.89-.29-1.53-.56-2.7-1.16-4.46-3.87-4.6-4.05-.13-.18-1.1-1.47-1.1-2.8s.7-1.98.95-2.25c.24-.27.53-.34.71-.34h.5c.16 0 .38-.06.6.45.24.57.79 1.98.86 2.12.07.14.11.31.02.5-.09.18-.14.3-.27.46-.14.16-.29.35-.41.47-.14.14-.28.29-.12.56.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.27.14.43.11.6-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.55.73 1.82.86.27.14.45.2.51.32.07.11.07.66-.17 1.32z"/></svg>
        <span>ابعت الطلب على واتساب</span>
      </button>
    </div>
  </div>
</div>

<footer>قطاف &middot; القطفة الأولى لك &middot; كل يوم اختيار جديد</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBT2PiOR05uJkiNB2GgNiy7X8hfOjHaoUA",
    authDomain: "qitaf-orders.firebaseapp.com",
    databaseURL: "https://qitaf-orders-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "qitaf-orders",
    storageBucket: "qitaf-orders.firebasestorage.app",
    messagingSenderId: "705411886211",
    appId: "1:705411886211:web:37cacf678fa03ceb867fb6",
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const WHATSAPP_NUMBER = "201030806246";

  function generateOrderId(){
    const now = new Date();
    const stamp = now.getFullYear().toString().slice(2) + (now.getMonth()+1).toString().padStart(2,'0') + now.getDate().toString().padStart(2,'0');
    return `Q${stamp}${Math.floor(Math.random()*900+100)}`;
  }

  let PRODUCTS = {};
  let discount = { enabled:false, percent:0, text:'' };
  let minOrder = 0;
  const cart = {}; // key: `${productId}::${variantKey}` -> qty
  let activeCat = 'all';

  let deliverySettings = { enabled:false, fee:0, free:false, discountPercent:0, startDate:'', endDate:'', text:'' };

  onValue(ref(db, 'settings/delivery'), (snap) => {
    deliverySettings = snap.val() || deliverySettings;
    renderDeliveryBanner();
    updateCartBar();
  });

  function isDeliveryOfferActive(){
    if(!deliverySettings.startDate && !deliverySettings.endDate) return true;
    const today = new Date().toISOString().slice(0,10);
    if(deliverySettings.startDate && today < deliverySettings.startDate) return false;
    if(deliverySettings.endDate && today > deliverySettings.endDate) return false;
    return true;
  }

  function deliveryFeeFinal(){
    if(!deliverySettings.enabled) return 0;
    if(deliverySettings.free && isDeliveryOfferActive()) return 0;
    let fee = deliverySettings.fee || 0;
    if(deliverySettings.discountPercent > 0 && isDeliveryOfferActive()){
      fee = Math.round(fee * (1 - deliverySettings.discountPercent/100));
    }
    return fee;
  }

  function renderDeliveryBanner(){
    const el = document.getElementById('deliveryBanner');
    if(!el) return;
    if(deliverySettings.enabled && deliverySettings.text && isDeliveryOfferActive()){
      el.textContent = '🚚 ' + deliverySettings.text;
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
  }

  onValue(ref(db, 'settings/minOrder'), (snap) => {
    minOrder = snap.val() || 0;
  });

  const grid = document.getElementById('product-grid');
  const banner = document.getElementById('discountBanner');

  onValue(ref(db, 'products'), (snap) => {
    PRODUCTS = snap.val() || {};
    renderGrid();
  });

  onValue(ref(db, 'settings/bannerImage'), (snap) => {
    const url = snap.val();
    const box = document.getElementById('bannerImageBox');
    const img = document.getElementById('bannerImageEl');
    if(url){
      img.src = url;
      box.classList.add('show');
    } else {
      box.classList.remove('show');
    }
  });

  onValue(ref(db, 'settings/discount'), (snap) => {
    const d = snap.val();
    discount = d || { enabled:false, percent:0, text:'' };
    if(discount.enabled && discount.percent > 0){
      banner.textContent = discount.text ? `🏷️ ${discount.text} — خصم ${discount.percent}%` : `🏷️ خصم ${discount.percent}% على كل الطلبات النهاردة`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
    updateCartBar();
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      renderGrid();
    });
  });

  function renderGrid(){
    const entries = Object.entries(PRODUCTS).filter(([id,p]) => activeCat === 'all' || p.category === activeCat);
    if(entries.length === 0){
      grid.innerHTML = '<p class="empty-hint">مفيش أصناف متاحة دلوقتي في القسم ده</p>';
      return;
    }
    grid.innerHTML = entries.map(([id, p]) => {
      const variants = Object.entries(p.variants || {});
      const firstVariantKey = variants[0] ? variants[0][0] : '';
      return `
      <div class="card" id="card-${id}">
        ${!p.available ? '<div class="out-badge">مش متوفر النهارده</div>' : ''}
        <div class="card-emoji">${p.emoji}</div>
        <div class="card-name">${p.name}</div>
        ${variants.length > 1 ? `
          <select class="variant-select" data-pid="${id}" ${!p.available ? 'disabled' : ''}>
            ${variants.map(([vk,v]) => `<option value="${vk}">${v.label} — ${v.price} ج</option>`).join('')}
          </select>
        ` : `<div class="card-price" data-price="${id}">${variants[0] ? variants[0][1].label + ' — ' + variants[0][1].price + ' ج' : ''}</div>`}
        <div class="qty-row">
          <button class="qty-btn" data-action="minus" data-pid="${id}" ${!p.available ? 'disabled':''}>−</button>
          <span class="qty-val" id="qty-${id}">0</span>
          <button class="qty-btn" data-action="plus" data-pid="${id}" ${!p.available ? 'disabled':''}>+</button>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pid = btn.dataset.pid;
        const delta = btn.dataset.action === 'plus' ? 1 : -1;
        const select = grid.querySelector(`.variant-select[data-pid="${pid}"]`);
        const variants = Object.entries(PRODUCTS[pid].variants || {});
        const vk = select ? select.value : variants[0][0];
        changeQty(pid, vk, delta);
      });
    });
  }

  function changeQty(pid, vk, delta){
    const key = pid + '::' + vk;
    const current = cart[key] || 0;
    const next = Math.max(0, current + delta);
    let totalQtyForProduct = 0;
    Object.keys(cart).forEach(k => { if(k.startsWith(pid+'::') && k !== key) totalQtyForProduct += cart[k]; });

    if(next === 0) delete cart[key]; else cart[key] = next;

    document.getElementById('qty-' + pid).textContent = next + totalQtyForProduct;
    document.getElementById('card-' + pid).classList.toggle('in-cart', (next + totalQtyForProduct) > 0);
    updateCartBar();
  }

  function cartItems(){
    return Object.entries(cart).map(([key, qty]) => {
      const [pid, vk] = key.split('::');
      const p = PRODUCTS[pid];
      const v = p.variants[vk];
      return { name: p.name, emoji: p.emoji, unit: v.label, price: v.price, qty, subtotal: v.price * qty };
    });
  }

  function cartSubtotal(){ return cartItems().reduce((s,i) => s + i.subtotal, 0); }
  function discountAmount(){ return discount.enabled ? Math.round(cartSubtotal() * discount.percent / 100) : 0; }
  function itemsTotal(){ return cartSubtotal() - discountAmount(); }
  function cartTotal(){ return itemsTotal() + deliveryFeeFinal(); }

  const cartBar = document.getElementById('cartBar');
  const cartCount = document.getElementById('cartCount');
  const cartTotalEl = document.getElementById('cartTotal');

  function updateCartBar(){
    const items = cartItems();
    if(items.length === 0){ cartBar.classList.remove('show'); return; }
    cartBar.classList.add('show');
    cartCount.textContent = items.length + (items.length === 1 ? ' صنف' : ' أصناف');
    const disc = discountAmount();
    cartTotalEl.innerHTML = disc > 0
      ? `<span class="old">${cartSubtotal()} ج</span>${cartTotal()} جنيه`
      : `${cartTotal()} جنيه`;
  }

  const overlay = document.getElementById('overlay');
  const orderList = document.getElementById('orderList');

  function renderOrderList(){
    const items = cartItems();
    const disc = discountAmount();
    const delivery = deliveryFeeFinal();
    orderList.innerHTML = items.map(i => `
      <div class="order-row">
        <span>${i.emoji} ${i.name} (${i.unit}) × ${i.qty}</span>
        <span class="sub-total">${i.subtotal} جنيه</span>
      </div>
    `).join('') +
    (disc > 0 ? `<div class="discount-row"><span>خصم ${discount.percent}%</span><span>- ${disc} جنيه</span></div>` : '') +
    (deliverySettings.enabled ? `<div class="order-row"><span>التوصيل</span><span class="sub-total">${delivery === 0 ? 'مجانًا' : delivery + ' جنيه'}</span></div>` : '') +
    `<div class="order-total-row"><span>الإجمالي</span><span>${cartTotal()} جنيه</span></div>` +
    (minOrder > 0 && itemsTotal() < minOrder ? `<div class="min-order-warning" style="margin-top:10px;">أقل قيمة للطلب ${minOrder} جنيه</div>` : '');
  }

  document.getElementById('openCheckout').addEventListener('click', () => { renderOrderList(); overlay.classList.add('show'); });
  document.getElementById('closeSheet').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });

  let payMethod = 'كاش عند الاستلام';
  document.querySelectorAll('.pay-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.pay-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      payMethod = opt.dataset.pay;
    });
  });

  const nameInput = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');
  const addressInput = document.getElementById('custAddress');
  let customerLocation = null;

  document.getElementById('shareLocationBtn').addEventListener('click', () => {
    const btn = document.getElementById('shareLocationBtn');
    const status = document.getElementById('locationStatus');
    if(!navigator.geolocation){
      status.textContent = 'المتصفح ده مش بيدعم مشاركة الموقع';
      return;
    }
    status.textContent = 'جاري تحديد موقعك...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        customerLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        btn.textContent = '✓ تم تحديد موقعك بنجاح';
        btn.classList.add('done');
        status.textContent = 'هيوصل مع الطلب لينك موقعك على الخريطة';
      },
      () => {
        status.textContent = 'ماقدرناش نوصل لموقعك، تأكد من إذن الموقع وحاول تاني';
      }
    );
  });
  const sendBtn = document.getElementById('sendOrder');

  function validateForm(){
    document.getElementById('formError').style.display = 'none';
  }
  [nameInput, phoneInput, addressInput].forEach(el => el.addEventListener('input', validateForm));

  function showFormError(text){
    const el = document.getElementById('formError');
    el.textContent = text;
    el.style.display = 'block';
  }

  sendBtn.addEventListener('click', () => {
    const items = cartItems();
    if(items.length === 0) return;

    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const address = addressInput.value.trim();

    const infoOk = name.length > 1 && phone.length >= 10 && address.length > 5;
    if(!infoOk){
      showFormError('تأكد من معلوماتك وحاول الإرسال. أو راسلنا مباشرة على واتساب.');
      return;
    }

    if(minOrder > 0 && itemsTotal() < minOrder){
      showFormError(`الحد الأدنى للطلب ${minOrder} جنيه — طلبك الحالي ${itemsTotal()} جنيه، ضيف كمان شوية عشان تكمل.`);
      return;
    }

    document.getElementById('formError').style.display = 'none';
    sendBtn.disabled = true;
    sendBtn.querySelector('span').textContent = 'جاري إرسال الطلب...';

    const orderId = generateOrderId();
    const now = Date.now();
    const customerName = name;
    const customerPhone = phone;
    const disc = discountAmount();
    const deliveryFee = deliveryFeeFinal();

    set(ref(db, 'orders/' + orderId), {
      customerName, customerPhone, address,
      location: customerLocation,
      stage: 'preparing', createdAt: now, stageStarts: { preparing: now },
      items: items.map(i => ({ name:i.name, unit:i.unit, qty:i.qty, price:i.price, subtotal:i.subtotal })),
      subtotal: cartSubtotal(), discount: disc, deliveryFee, total: cartTotal(), paymentMethod: payMethod
    }).then(() => {
      let msg = `طلب جديد من قطاف 🌿\n\nرقم الطلب: ${orderId}\n`;
      msg += `الاسم: ${customerName}\nالموبايل: ${customerPhone}\nالعنوان: ${address}\n`;
      if(customerLocation){
        msg += `الموقع على الخريطة: https://maps.google.com/?q=${customerLocation.lat},${customerLocation.lng}\n`;
      }
      msg += `\nالأصناف:\n`;
      items.forEach(i => { msg += `- ${i.name} (${i.unit}) × ${i.qty} = ${i.subtotal} جنيه\n`; });
      if(disc > 0) msg += `\nخصم ${discount.percent}%: -${disc} جنيه`;
      if(deliverySettings.enabled) msg += `\nالتوصيل: ${deliveryFee === 0 ? 'مجانًا' : deliveryFee + ' جنيه'}`;
      msg += `\nالإجمالي: ${cartTotal()} جنيه\nطريقة الدفع: ${payMethod}`;

      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
      sendBtn.disabled = false;
      sendBtn.querySelector('span').textContent = 'ابعت الطلب على واتساب';
    }).catch(() => {
      showFormError('حصلت مشكلة في إرسال الطلب، حاول تاني. أو راسلنا مباشرة على واتساب.');
      sendBtn.disabled = false;
      sendBtn.querySelector('span').textContent = 'ابعت الطلب على واتساب';
    });
  });

  const dateEl = document.getElementById('today-date');
  const today = new Date();
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  dateEl.textContent = days[today.getDay()] + ' ' + today.getDate() + '/' + (today.getMonth()+1);
</script>
</body>
</html>
